{# Shared guidance card: set `steps_title` and `steps` (list of strings) #}
<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2 mb-2">
      <i class="bi bi-list-check text-primary"></i>
      <div class="fw-semibold">{{ steps_title }}</div>
    </div>
    <ol class="mb-0 small text-muted ps-3">
      {% for s in steps %}
        <li class="mb-1">{{ s }}</li>
      {% endfor %}
    </ol>
  </div>
</div>
