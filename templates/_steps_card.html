{# Shared guidance card: set `steps_title` and `steps` (list of strings) #}
{% if steps is defined and steps %}
<div class="mb-2">
  <a class="d-inline-flex align-items-center gap-1 text-muted text-decoration-none"
     data-bs-toggle="collapse" href="#stepsCollapse" role="button"
     aria-expanded="false" aria-controls="stepsCollapse"
     style="opacity:0.75; cursor:pointer; font-size:12px">
    <i class="bi bi-list-check text-primary" style="font-size:13px"></i>
    <span class="fw-semibold">{{ steps_title }}</span>
    <i class="bi bi-chevron-down" style="font-size:10px"></i>
  </a>
  <div class="collapse" id="stepsCollapse">
    <div class="card card-body border-0 shadow-sm py-2 px-3 mt-1" style="font-size:12px;background:#f8fafc">
      <ol class="mb-0 text-muted ps-3">
        {% for s in steps %}
          <li class="mb-1">{{ s }}</li>
        {% endfor %}
      </ol>
    </div>
  </div>
</div>
{% endif %}
